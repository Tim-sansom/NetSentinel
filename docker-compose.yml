services:
  # 1. The Database (MySQL 8)
  db:
    image: mysql:8.0
    container_name: netsentinel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro # Auto-imports schema on first run
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The Web Server (Apache + PHP + Cron)
  web:
    build: .
    container_name: netsentinel-web
    restart: unless-stopped
    ports:
      - "9095:80" # Access dashboard at http://localhost:8080
    volumes:
      - ./public:/var/www/html/public:delegated
      - ./cronjobs:/var/www/html/cronjobs:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # 3. The Background Worker (Alternative to host cron, keeps it self-contained)
  worker:
    build: .
    container_name: netsentinel-worker
    restart: unless-stopped
    command: sh -c 'while true; do php /var/www/html/cronjobs/update_threat_feed.php >> /var/log/threat_feed.log 2>&1; sleep 21600; done'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: