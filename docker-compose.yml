services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: netsentinelpass
      MYSQL_DATABASE: netsentinel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - netsentinel-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  php:
    image: php:8.2-apache
    platform: linux/amd64
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html:delegated
    restart: unless-stopped
    networks:
      - netsentinel-network
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  cron:
    image: php:8.2-cli
    platform: linux/amd64
    volumes:
      - ./src:/var/www/html:ro
      - ./cronjobs:/etc/cron.d:ro
      - ./cron-logs:/var/log/cron
    command: >
      sh -c "
      apt-get update && 
      apt-get install -y cron && 
      mkdir -p /var/log/cron &&
      chmod 0644 /etc/cron.d/* 2>/dev/null || true &&
      crontab /etc/cron.d/* 2>/dev/null || echo 'No cron jobs found' &&
      touch /var/log/cron.log &&
      echo 'Cron service started' &&
      cron -f
      "
    restart: unless-stopped
    networks:
      - netsentinel-network
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  netsentinel-network:
    driver: bridge

volumes:
  mysql_data:
