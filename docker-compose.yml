services:
  dashboard:
    build: .  # <-- CHANGED FROM image: php:8.3-apache
    platform: linux/amd64
    container_name: netsentinel-dashboard
    ports:
      - "8088:80"
    volumes:
      - ./public:/var/www/html:delegated
    environment:
      NETSENTINEL_ENV: development
      DB_HOST: mysql
      DB_NAME: netsentinel
      DB_USER: netsentinel_user
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - netsentinel-network

  collector:
    image: python:3.10-slim
    platform: linux/amd64
    container_name: netsentinel-collector
    working_dir: /app
    volumes:
      - ./collector:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python collector.py"
    environment:
      PYTHONUNBUFFERED: "1"
      NETSENTINEL_ENV: development
      API_URL: http://dashboard:80/api/submit.php
      DEVICE_ID: agent-001
      DB_HOST: mysql
      DB_NAME: netsentinel
      DB_USER: netsentinel_user
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - netsentinel-network

  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: netsentinel-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: netsentinel
      MYSQL_USER: netsentinel_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - netsentinel-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: netsentinel-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - netsentinel-network

networks:
  netsentinel-network:
    driver: bridge

volumes:
  mysql_data: